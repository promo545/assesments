[project]
name = "support-ticket-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
]

[project.optional-dependencies]
test = [
    "httpx2",
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
