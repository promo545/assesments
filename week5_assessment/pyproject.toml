[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-bookmark-manager-api"
version = "0.1.0"
description = "Week 5 production FastAPI assessment"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
    "alembic",
    "python-jose[cryptography]",
    "pwdlib[argon2]",
    "redis",
    "pydantic[email]",
    "pytest",
    "httpx",
    "fakeredis",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]
